{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <title>{% block titulo %}{% endblock titulo %}</title>
    {% load static %}

    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon.ico' %}">

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Estilos globales -->
    <style>
      body {
        display: flex;
        flex-direction: column;
        background-color: #E8F5E9;
        min-height: 100vh;
      }
      main {
        flex: 1;
      }
      footer {
        background: linear-gradient(135deg, #198754, #145a32);
        color: white;
        text-align: center;
        padding: 1rem 0;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.2);
      }
      footer a {
        color: #ffe484;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">

    <!-- 🔸 Logo + nombre -->
    <a class="navbar-brand fw-bold text-success d-flex align-items-center gap-2" href="{% url 'inicio' %}">
      <img src="{% static 'img/logo_bibliopavini.png' %}" 
           alt="Logo BiblioPavini" 
           width="40" height="40" 
           class="rounded-circle shadow-sm">
      <span>BiblioPavini</span>
    </a>

    <!-- 🔸 Enlaces -->
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="{% url 'inicio' %}">Inicio</a>
      <a class="nav-link" href="{% url 'market' %}">Catálogo</a>
      <a class="nav-link" href="{% url 'nosotros' %}">Nosotros</a>
    </div>

  </div>
</nav>


    <!-- 🔹 CONTENIDO PRINCIPAL -->
    <main class="container my-4">
      {% block contenido %}{% endblock %}
    </main>

    <!-- 🔹 FOOTER -->
    <footer>
      <div class="container">
        <p class="mb-1">
          <i class="bi bi-book"></i> Proyecto <strong>BiblioPavini</strong> —
          Biblioteca Patrimonial San Ignacio &copy; {{ year }}
        </p>
        <small class="text-light">
          <i class="bi bi-github"></i> Desarrollado con ❤️ por Jorge Moreno
        </small>
      </div>
    </footer>

    <!-- 🔹 Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
